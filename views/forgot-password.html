<!DOCTYPE html>
<html>
<head>
  <title>Reset Password - ExpressBlog</title>
  <!-- Şifre sıfırlama sayfası da ortak form stillerini kullanır. -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Kullanıcı diğer sayfalara buradaki bağlantılarla dönebilir. -->
  <nav>
    <a href="/">Home</a>
    <a href="/register">Register</a>
    <a href="/login">Login</a>
    <a href="/posts">Posts</a>
    <a href="/forgot-password">Reset Password</a>
  </nav>

  <div class="login-container">
    <h2 class="text-center"> Şifre Sıfırlama</h2>

    <!-- Form POST isteği ile /forgot-password endpoint'ine gider ve şifre güncellenir. -->
    <form action="/forgot-password" method="POST">
      
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password:</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
      </div>

      <button type="submit" class="btn-primary">Şifreyi Güncelle</button>
    </form>

    <div class="text-center mt-15">
        <a href="/login">Giriş sayfasına dön</a>
    </div>
  </div>

</body>
</html>
